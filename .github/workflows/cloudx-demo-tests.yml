name: Cloudx demo validation

on:
  pull_request:
    paths:
      - 'ric-disposable-cyberlab/learner-lab-demo/**'
      - '.github/workflows/cloudx-demo-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint
      - name: Validate AWS CloudFormation template
        run: cfn-lint ric-disposable-cyberlab/learner-lab-demo/cloudx-demo.yaml
      - name: Test Linux assessment grader
        run: python -m unittest discover -s ric-disposable-cyberlab/learner-lab-demo/tests -v
